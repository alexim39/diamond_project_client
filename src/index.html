<!doctype html>
<html lang="en">
<head>
  <style type="text/css">
    html, body { height: 100%; }
    body { margin: 0; background: #03010f; }
    .app-loading {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 42%, rgba(212, 169, 65, 0.18), transparent 38%),
        linear-gradient(180deg, #050111 0%, #03010f 62%, #0f0f0f 100%);
      color: #f3ecdd;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }
    .app-loading::before {
      content: '';
      position: absolute;
      inset: -25%;
      background: radial-gradient(circle at 50% 45%, rgba(255, 193, 7, 0.1), transparent 48%);
      animation: dpGlow 6s ease-in-out infinite;
      z-index: -1;
    }
    .app-loading::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 0%, rgba(3, 1, 15, 0.5) 100%);
      z-index: -1;
    }
    .splash-inner {
      position: relative;
      z-index: 1;
      width: min(90vw, 620px);
      padding: 2em 1.25em;
    }
    .splash-mark {
      width: 96px;
      height: 96px;
      margin: 0 auto 1.4em;
      filter: drop-shadow(0 0 18px rgba(212, 169, 65, 0.35));
      animation: dpBreathe 3.2s ease-in-out infinite;
    }
    .splash-mark svg {
      display: block;
      width: 100%;
      height: 100%;
    }
    .splash-eyebrow {
      margin: 0 0 0.9em;
      color: #d4a941;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }
    .splash-title {
      margin: 0 auto;
      max-width: 18em;
      font-family: Garamond, Georgia, 'Times New Roman', serif;
      font-size: clamp(1.7rem, 4vw, 2.5rem);
      line-height: 1.18;
      color: #f3ecdd;
    }
    .splash-title span {
      color: #ffc107;
    }
    .splash-progress {
      width: clamp(180px, 42vw, 240px);
      height: 2px;
      margin: 1.8em auto 0;
      overflow: hidden;
      background: rgba(212, 169, 65, 0.2);
      border-radius: 99px;
    }
    .splash-progress span {
      display: block;
      width: 42%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #ffc107, #d4a941, transparent);
      border-radius: 99px;
      animation: dpLoad 1.8s ease-in-out infinite;
    }
    .splash-status {
      margin: 0.9em 0 0;
      color: rgba(243, 236, 221, 0.55);
      font-size: 0.78rem;
      letter-spacing: 0.04em;
    }
    .splash-foot {
      position: absolute;
      left: 1.25em;
      right: 1.25em;
      bottom: 1.6em;
      margin: 0;
      color: rgba(243, 236, 221, 0.38);
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .splash-foot span {
      color: #d4a941;
      padding: 0 0.4em;
    }
    @keyframes dpBreathe {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.035); opacity: 1; }
    }
    @keyframes dpLoad {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(340%); }
    }
    @keyframes dpGlow {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.04); }
    }
    @media (max-width: 600px) {
      .splash-mark { width: 72px; height: 72px; margin-bottom: 1.1em; }
      .splash-title { font-size: 1.55rem; }
      .splash-foot { font-size: 0.56rem; letter-spacing: 0.1em; }
    }
    @media (prefers-reduced-motion: reduce) {
      .splash-mark, .splash-progress span, .app-loading::before {
        animation: none;
      }
      .splash-progress span { width: 100%; opacity: 0.7; }
    }
  </style>
